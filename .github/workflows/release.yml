name: release

# 打 v* 标签时自动构建 Windows 与 macOS 包并挂到 GitHub Release 上，
# 这样用户不必自己装 Python 就能下载使用。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # build_exe.ps1 会自己创建 .venv 并安装 requirements.txt，
      # 所以这里不要预装依赖，也不要传 -SkipInstall。
      - name: 打包
        run: powershell -ExecutionPolicy Bypass -File .\build_exe.ps1

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: qPCR_Analyzer
          path: dist/qPCR_Analyzer.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qPCR_Analyzer.zip
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # build_app.sh 会自己创建 .venv 并安装 requirements.txt。
      - name: 打包
        run: bash ./build_app.sh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: qPCR_Analyzer_macOS
          path: dist/qPCR_Analyzer_macOS.zip

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/qPCR_Analyzer_macOS.zip
          generate_release_notes: true
